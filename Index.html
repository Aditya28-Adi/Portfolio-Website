<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio_Website</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <div id="wrapper">

        <div class="container">
                <div class="navbar">
                
                    <div class="logo-container">
                        <img src="Name_Logo.jpg" alt="Image" class="logo">
                        <div class="logo-text" id="logoText">&nbsp ditya Kedar</div>
                    </div>


                    <div class="nav-items">
                        <div><a href="#projects">Projects</a></div>
                        <div><a href="#skills">Skills</a></div>
                        <div><a href="#contactMe">Contact Me</a></div>
                    </div>
                </div>
            <div class="hero-section">

                <div class="faded-text">Aditya Kedar2</div>

                <div class="hero-section-left">
                    <div class="hero-section-heading">Hi! Aditya Kedar</div>
                
                    <div class="hero-section-heading hero-section-sub-heading">
                    I am a <span class="role"></span>
                    </div>

                    <div class="hero-section-description">
                    I'm a Software Developer and here is my portfolio Website. Here you'll learn about my journey as a Software Developer.
                    </div>
            
                    <div class="button" id="button">Hire Me</div>

                </div>  
            
                <div class="hero-section-right">

                    <div class="absolute icons icon-dots">
                    <img src="\Images\dots.png" alt="" />
                    </div>

                    <div class="absolute icons icon-cube">
                    <img src="\Images\cube.png" alt="" />
                    </div>

                    <div class="absolute icons icon-circle">
                    <img src="\Images\circle.png" alt="" /> 
                    </div>

                    <div class="absolute icons icon-zigzag">
                    <img src="\Images\zigzags.png" alt="" />
                    </div>

                    <div class="absolute icons icon-plus">
                    <img src="\Images\plus.png" alt="" />
                    </div>

                    <div class="user-image">
                    <img src="\Images\UserImage.png" alt="" />
                    </div>
                </div>

            </div>

        </div>

    </div>
  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
  <script src="https://kit.fontawesome.com/58a810656e.js" crossorigin="anonymous"></script>
  <script>
    var typeData = new Typed(".role", {
      strings: [
        "Full Stack Developer",
        "Web Developer",
        "UI-UX Designer",
        "Backend Developer",
        "Coder",
      ],
      loop: true,
      typeSpeed: 100,
      backSpeed: 80,
      backDelay: 1000,
    });
  </script>
</body>
</html>
